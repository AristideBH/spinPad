name: DCO Check

on:
  pull_request:
    branches: ["*"]

jobs:
  dco:
    name: Developer Certificate of Origin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: tisonkun/actions-dco@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
